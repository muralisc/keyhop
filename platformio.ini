; Two hardware targets share one firmware:
;   pio run -e olimex      Olimex ESP32-S3-DevKit-LiPo (default)
;   pio run -e waveshare   Waveshare ESP32-S3-DEV-KIT-N8R8 (USB host does NOT work:
;                          GPIO19/20 are hard-wired to its onboard CH334F hub)

[platformio]
default_envs = olimex

[env]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; USB-OTG mode: the OTG controller (used for USB host) owns GPIO19/20,
; not the USB-Serial/JTAG peripheral.
build_unflags =
    -DARDUINO_USB_MODE=1
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=3

lib_deps =
    h2zero/NimBLE-Arduino@^1.4.1
    https://github.com/tanakamasayuki/EspUsbHost.git#9e658fa  ; last pre-v2 commit: v2 needs core 3.x and has a different API

; Flash and monitor through the "USB-UART" USB-C port (CH340X, auto-reset).
; The keyboard stays on GPIO19/20 via the USB-A breakout.
[env:olimex]
build_flags =
    ${env.build_flags}
    -DBOARD_OLIMEX

; Flash via the single USB-C port: hold BOOT, tap RESET, release BOOT.
[env:waveshare]
build_flags =
    ${env.build_flags}
    -DBOARD_WAVESHARE
